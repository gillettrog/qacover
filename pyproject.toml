[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gillettrog-qacover"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别知识库的问答对覆盖上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "gillettrog" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://gillettrog.github.io"
Repository = "https://github.com/gillettrog/qacover"
Issues = "https://github.com/gillettrog/qacover/issues"

[project.scripts]
qacover = "qacover:main"

[tool.setuptools]
py-modules = ["qacover"]
